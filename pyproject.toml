[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "museum_guide"
version = "0.1.0"
description = "Neural-network components of a museum guide: artwork style classification (MLP from scratch, ResNet transfer learning) and a production recommendation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
